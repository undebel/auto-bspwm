# ============================================================
# Backend — "xrender" is the safe default: this environment is
# typically run inside a VM (VMware/VirtualBox), where picom's
# glx backend composites broken/stale window buffers on the
# virtual GPU. On bare metal with a real GPU, switch to "glx"
# for better performance. (Config uses the classic option
# syntax, still supported up to picom v13 alongside the newer
# `rules`/`animations` system.)
# ============================================================
backend = "xrender";

vsync = true;
# use-damage repaints only the regions X reports as damaged. On virtual
# GPUs (VMware/VirtualBox) that reporting is incomplete, leaving stale
# pixels behind when many windows change at once (desktop switch) or when
# an override-redirect window maps/unmaps over another (select boxes,
# dropdown menus). Full repaints cost a little CPU but are artifact-free.
use-damage = false;

detect-rounded-corners = true;
detect-client-opacity = true;

# ============================================================
# Window opacity per application
# ============================================================
opacity-rule = [
	"95:class_g = 'kitty' && focused",
	"70:class_g = 'kitty' && !focused",
	"95:class_g = 'Thunar' && focused",
	"70:class_g = 'Thunar' && !focused",
	"70:class_i = 'presel_feedback'"
];

# ============================================================
# Fade animations
# ============================================================
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

fade-exclude = [
	"class_g = 'Polybar'"
];

# ============================================================
# Rounded corners
# ============================================================
corner-radius = 10.0;
rounded-corners-exclude = [
	"class_g = 'Rofi'",
	"class_g = 'Polybar'",
	"window_type = 'dock'",
	"window_type = 'desktop'"
];

# ============================================================
# Shadows (disabled to match the original aesthetic — flip to
# true if you want depth on floating windows)
# ============================================================
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-exclude = [
	"name = 'Notification'",
	"class_g = 'Polybar'",
	"_GTK_FRAME_EXTENTS@"
];

# ============================================================
# Window-type specific tweaks
# ============================================================
wintypes:
{
	tooltip       = { fade = true;  shadow = false; opacity = 0.9;  focus = true; };
	dock          = { shadow = false; };
	dnd           = { shadow = false; };
	popup_menu    = { opacity = 0.95; };
	dropdown_menu = { opacity = 0.95; };
};
