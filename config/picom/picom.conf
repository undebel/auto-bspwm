# ============================================================
# Backend — modern OpenGL backend (yshui/picom 9.x / 10.x / 11.x).
# Falls back gracefully on systems without 3D accel. If you run
# inside a VM without GPU passthrough, switch back to "xrender".
# ============================================================
backend = "glx";

vsync = true;
use-damage = true;
glx-no-stencil = true;

detect-rounded-corners = true;
detect-client-opacity = true;

# ============================================================
# Window opacity per application
# ============================================================
opacity-rule = [
	"95:class_g = 'kitty' && focused",
	"70:class_g = 'kitty' && !focused",
	"95:class_g = 'Thunar' && focused",
	"70:class_g = 'Thunar' && !focused",
	"70:class_i = 'presel_feedback'"
];

# ============================================================
# Fade animations
# ============================================================
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

fade-exclude = [
	"class_g = 'Polybar'"
];

# ============================================================
# Rounded corners
# ============================================================
corner-radius = 10.0;
rounded-corners-exclude = [
	"class_g = 'Rofi'",
	"class_g = 'Polybar'",
	"window_type = 'dock'",
	"window_type = 'desktop'"
];

# ============================================================
# Shadows (disabled to match the original aesthetic — flip to
# true if you want depth on floating windows)
# ============================================================
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-exclude = [
	"name = 'Notification'",
	"class_g = 'Polybar'",
	"_GTK_FRAME_EXTENTS@:c"
];

# ============================================================
# Window-type specific tweaks
# ============================================================
wintypes:
{
	tooltip       = { fade = true;  shadow = false; opacity = 0.9;  focus = true; };
	dock          = { shadow = false; };
	dnd           = { shadow = false; };
	popup_menu    = { opacity = 0.95; };
	dropdown_menu = { opacity = 0.95; };
};
